<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- DEV-домен: жёстко закрыт от поисковиков до переезда на боевой домен. Снять при запуске. -->
    <meta name="robots" content="noindex, nofollow, noarchive, noimageindex" />
    <!-- НЕ добавлять interactive-widget=overlays-content (было 21.07.2026, откачено 28.07.2026).
         При overlays-content клавиатура рисуется поверх и НЕ меняет ни разметку, ни видимую
         область. Последствия: (1) браузер перестаёт сам прокручивать к полю ввода, (2)
         visualViewport.height не уменьшается — то есть высоту клавиатуры измерить нечем,
         и вся JS-компенсация (--keyboard-inset) всегда равна нулю. Из-за этого поле ввода
         в «Напиши предложение» месяц оставалось под клавиатурой.
         Дефолт (resizes-visual) — клавиатура сжимает видимую область, браузер сам скроллит
         к полю, а visualViewport честно отдаёт высоту для наших шторок. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#C9A54A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DeutschLernen" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- Немецкий флаг как фавикон -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇩🇪</text></svg>" />
    <title>Deutsch Lernen</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
