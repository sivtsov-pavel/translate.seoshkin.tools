# ⚠️ ИСТОЧНИК ИСТИНЫ ДЛЯ ДОМЕНА translate.seoshkin.tools — этот файл в git проекта translate.
# НЕ редактировать на сервере вручную: перетрут — восстанавливается `git checkout -- nginx/`.
# Монтируется в шлюз seoshkin_nginx как /etc/nginx/conf.d/translate.conf (см. nginx/README.md).
#
# С 2026-07-26 старый домен НАВСЕГДА редиректит (301) на deutschlernen.ai:
# чинит старые ссылки-приглашения и конфликт прав доступа из-за разных доменов (куки/JWT
# привязаны к домену). ACME-location оставлен, чтобы серт старого домена продлевался,
# пока по интернету гуляют старые ссылки. Применено на сервере в
# /var/www/translate.seoshkin.tools/nginx.conf (бэкап: nginx.conf.bak-20260726).

server {
    listen 80;
    server_name translate.seoshkin.tools;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; allow all; }
    location / { return 301 https://deutschlernen.ai$request_uri; }
}

server {
    listen 443 ssl;
    server_name translate.seoshkin.tools;

    ssl_certificate     /etc/letsencrypt/live/translate.seoshkin.tools/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/translate.seoshkin.tools/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; allow all; }

    location / { return 301 https://deutschlernen.ai$request_uri; }
}
