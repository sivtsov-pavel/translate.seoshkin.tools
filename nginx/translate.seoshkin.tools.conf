# ⚠️ ИСТОЧНИК ИСТИНЫ ДЛЯ ДОМЕНА translate.seoshkin.tools — этот файл в git проекта translate.
# НЕ редактировать на сервере вручную: перетрут — восстанавливается `git checkout -- nginx/`.
# Монтируется в шлюз seoshkin_nginx как /etc/nginx/conf.d/translate.conf (см. nginx/README.md).
#
# Домен ОБСЛУЖИВАЕТ приложение, а не редиректит.
#
# История: 26.07.2026 здесь поставили постоянный 301 на deutschlernen.ai, чтобы старые
# ссылки-приглашения вели на новый домен. Это сломало Android-приложение: APK собран
# на ЭТОТ домен, и редирект уводил его на другой origin. Что получил Павел 28.07.2026:
#   • вход не работал — POST /api/auth/login получал 301, тело запроса терялось;
#   • иконки и вёрстка оставались старыми — service worker зарегистрирован на этом
#     origin, продолжал отдавать своё из кэша и обновиться не мог.
#
# ⚠️ НЕ возвращать сюда `return 301` до тех пор, пока APK не пересобран на
# deutschlernen.ai и новая версия не разошлась по устройствам.
# Порядок пересборки — android-twa/RELEASE_CHECKLIST.md.

server {
    listen 80;
    server_name translate.seoshkin.tools;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; allow all; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name translate.seoshkin.tools;

    ssl_certificate     /etc/letsencrypt/live/translate.seoshkin.tools/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/translate.seoshkin.tools/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 200m;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; allow all; }

    # proxy_pass ТОЛЬКО на имя контейнера: внутри шлюза 127.0.0.1 — это сам шлюз,
    # а не приложение (частая причина «сайт лёг»).
    location / {
        proxy_pass         http://translate-frontend-1:80;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 900s;
    }
}
